name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bc13fe&color_dots=#00ffff,#00ffff,#00ffff,#000080,#00ff00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bc13fe&color_dots=#00ffff,#00ffff,#00ffff,#000080,#00ff00

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
:
*   **Fundo Azul Neon**: Os três primeiros valores (`#00ffff`) mantêm o fundo e os dias de pouca atividade no azul vibrante que você escolheu anteriormente.
*   **Comida Azul Marinho**: O quarto valor (`#000080`) define que os dias com nível médio de contribuição aparecerão em azul marinho.
*   **Comida Verde**: O último valor (`#00ff00`) define que os seus commits mais intensos — como os projetos de **Java** e **C++** — serão representados por verde neon.
*   **Cobra Roxa**: Mantive a sua cobrinha em roxo neon (`#bc13fe`) para garantir o destaque visual no mapa.

### Passo a Passo para atualizar:
1.  Abra o arquivo `.github/workflows/snake.yml` no seu repositório.
2.  Apague todo o conteúdo atual e cole o código acima.
3.  Clique em **"Commit changes..."** para salvar.
4.  Vá na aba **Actions**, selecione o workflow **Generate Snake** e clique em **Run workflow** para processar as novas cores.

Isso vai deixar o seu portfólio de **Maker** com um visual único, destacando toda a sua evolução em programação! Conseguiu aplicar a mudança?
