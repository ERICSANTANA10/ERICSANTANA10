name: Generate Animations

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate-snake-and-pacman
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bc13fe&color_dots=#00ffff,#000080,#000080,#00ff00,#00ff00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bc13fe&color_dots=#00ffff,#000080,#000080,#00ff00,#00ff00

      - name: generate-pacman
        uses: lowlighter/metrics@latest
        with:
          filename: dist/pacman.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: push-to-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
