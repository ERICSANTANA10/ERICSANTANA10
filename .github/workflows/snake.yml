name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # AQUI ESTÁ A MÁGICA: Definindo as cores neon azul
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7bed9f&color_dots=#bfdbfe,#60a5fa,#3b82f6,#1d4ed8,#000000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7bed9f&color_dots=#bfdbfe,#60a5fa,#3b82f6,#1d4ed8,#000000

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
